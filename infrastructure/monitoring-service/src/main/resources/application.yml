spring:
  application:
    name: monitoring-service
  security:
    user:
      name: ${ADMIN_UI_USER:admin}
      password: ${ADMIN_UI_PASSWORD}
  boot:
    admin:
      ui:
        title: PCOM Platform Monitoring
server:
  port: 9090
  shutdown: graceful
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    metadata-map:
      user.name: ${OPS_USER:ops}
      user.password: ${OPS_PASSWORD}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}
  tracing.sampling.probability: ${TRACING_SAMPLING:1.0}
  otlp.tracing.endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
