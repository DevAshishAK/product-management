spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Demo/portfolio setup: config baked into the image. For production switch to the git backend:
          #   spring.cloud.config.server.git.uri=https://github.com/<org>/pcom-config  (drop the native profile)
          search-locations: classpath:/config-repo
server:
  port: 8888
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}
  tracing.sampling.probability: ${TRACING_SAMPLING:1.0}
  otlp.tracing.endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
