# Shared configuration served to every client application by the Config Server.
# ${VAR:default} placeholders are resolved by each CLIENT from its own environment (docker-compose / k8s ConfigMap+Secret).
server:
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/common
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${TOKEN_JWKS_URI:http://localhost:9000/.well-known/jwks.json}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all                       # wait for all in-sync replicas
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true      # no duplicates / reordering on producer retries
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
    listener:
      ack-mode: record
      concurrency: 3
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000     # Timeout pattern
            read-timeout: 5000
    loadbalancer:
      cache:
        ttl: 15s
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    metadata-map:
      user.name: ${OPS_USER:ops}          # lets Spring Boot Admin read the secured actuator
      user.password: ${OPS_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers,threaddump,circuitbreakers,retries
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
springdoc:
  swagger-ui:
    persist-authorization: true
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
app:
  security:
    ops:
      username: ${OPS_USER:ops}
      password: ${OPS_PASSWORD}
    token-url: ${TOKEN_URL:http://token-service/oauth2/token}
    service-client:
      id: ${spring.application.name}
      secret: ${SERVICE_CLIENT_SECRET:}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  messaging:
    partitions: ${KAFKA_PARTITIONS:6}
    replicas: ${KAFKA_REPLICAS:1}
    min-insync-replicas: ${KAFKA_MIN_ISR:1}

# ---- Resilience4j (Circuit Breaker, Retry, Bulkhead, Rate Limiter) ----
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          - com.pcom.common.core.BusinessException
    instances:
      userService: {base-config: default}
      productService: {base-config: default}
      orderService: {base-config: default}
      paymentGateway: {base-config: default}
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - feign.RetryableException
        ignore-exceptions:
          - com.pcom.common.core.BusinessException
    instances:
      userService: {base-config: default}
      productService: {base-config: default}
      orderService: {base-config: default}
      paymentGateway: {base-config: default}
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 25
        max-wait-duration: 100ms
    instances:
      userService: {base-config: default}
      productService: {base-config: default}
      orderService: {base-config: default}
  ratelimiter:
    instances:
      productService:
        limit-for-period: 200
        limit-refresh-period: 1s
        timeout-duration: 200ms
