resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
app:
  security:
    token-introspect-url: ${TOKEN_INTROSPECT_URL:http://token-service/oauth2/introspect}
