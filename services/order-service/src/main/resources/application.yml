spring:
  application:
    name: order-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD}
      fail-fast: true
      retry:
        max-attempts: 30
        initial-interval: 2000
        max-interval: 10000
