# Single-replica backing services for staging/demo. In production use managed PostgreSQL / Kafka (MSK, Confluent, Strimzi) / MongoDB / Redis.
# The postgres init script (docker/postgres/init.sh) must be mounted at /docker-entrypoint-initdb.d (e.g. from a ConfigMap) to create the per-service databases.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_USER, value: postgres}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: POSTGRES_PASSWORD}}
            - name: INVENTORY_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: INVENTORY_DB_PASSWORD}}
            - name: INVOICE_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: INVOICE_DB_PASSWORD}}
            - name: NOTIFICATION_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: NOTIFICATION_DB_PASSWORD}}
            - name: ORDER_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: ORDER_DB_PASSWORD}}
            - name: PAYMENT_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: PAYMENT_DB_PASSWORD}}
            - name: PRODUCT_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: PRODUCT_DB_PASSWORD}}
            - name: TOKEN_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: TOKEN_DB_PASSWORD}}
            - name: USER_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: USER_DB_PASSWORD}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {memory: 1Gi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 20Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mongo}
spec:
  serviceName: mongo
  replicas: 1
  selector: {matchLabels: {app: mongo}}
  template:
    metadata: {labels: {app: mongo}}
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports: [{containerPort: 27017}]
          env:
            - {name: MONGO_INITDB_ROOT_USERNAME, value: pcom}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: MONGO_PASSWORD}}
          volumeMounts: [{name: data, mountPath: /data/db}]
          resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {memory: 1Gi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: mongo}
spec:
  selector: {app: mongo}
  ports: [{port: 27017, targetPort: 27017}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis}
spec:
  serviceName: redis
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{containerPort: 6379}]
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {memory: 1Gi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kafka}
spec:
  serviceName: kafka
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.1
          ports: [{containerPort: 9092}]
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
          volumeMounts: [{name: data, mountPath: /var/lib/kafka/data}]
          resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {memory: 1Gi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 20Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: kafka}
spec:
  selector: {app: kafka}
  ports: [{port: 9092, targetPort: 9092}]
