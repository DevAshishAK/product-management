apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels: {app.kubernetes.io/name: inventory-service, app.kubernetes.io/part-of: pcom}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:                              # zero-downtime rolling update
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: inventory-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: inventory-service, app.kubernetes.io/part-of: pcom}
    spec:
      terminationGracePeriodSeconds: 60  # > spring.lifecycle.timeout-per-shutdown-phase (30s) + preStop
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: inventory-service}}
      containers:
        - name: inventory-service
          image: ghcr.io/your-org/pcom/inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8083}
          envFrom:
            - configMapRef: {name: platform-config}
          env:
            - name: CONFIG_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: CONFIG_USER
            - name: CONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: CONFIG_PASSWORD
            - name: OPS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: OPS_PASSWORD
            - name: EUREKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: EUREKA_PASSWORD
            - name: EUREKA_URL
              value: http://eureka:$(EUREKA_PASSWORD)@discovery-server:8761/eureka
            - name: SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: INVENTORY_SERVICE_SECRET
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: INVENTORY_DB_PASSWORD
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/inventorydb
            - name: DB_USER
              value: inventory_svc
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36              # up to 3 minutes to boot
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: ["sh", "-c", "sleep 10"]}   # let endpoints/Eureka deregistration propagate before SIGTERM
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  labels: {app.kubernetes.io/name: inventory-service, app.kubernetes.io/part-of: pcom}
spec:
  selector: {app.kubernetes.io/name: inventory-service}
  ports:
    - {name: http, port: 8083, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-service
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: inventory-service}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
    - type: Resource
      resource: {name: memory, target: {type: Utilization, averageUtilization: 80}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-service
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: inventory-service}
