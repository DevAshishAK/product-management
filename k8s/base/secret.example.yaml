# NOT applied by kustomize. Create the real secret out-of-band (kubectl create secret, Sealed Secrets, External Secrets, Vault CSI...).
# One Secret per namespace; keys referenced by the deployments:
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
  MONGO_PASSWORD: CHANGE_ME
  CONFIG_USER: config
  CONFIG_PASSWORD: CHANGE_ME
  EUREKA_USER: eureka
  EUREKA_PASSWORD: CHANGE_ME
  OPS_PASSWORD: CHANGE_ME
  ADMIN_UI_PASSWORD: CHANGE_ME
  MONGO_URI: mongodb://pcom:CHANGE_ME@mongo:27017/auditdb?authSource=admin
  JWT_PRIVATE_KEY: CHANGE_ME_base64_pkcs8        # scripts/generate-keys.sh
  JWT_PUBLIC_KEY: CHANGE_ME_base64_x509
  BOOTSTRAP_ADMIN_PASSWORD: CHANGE_ME
  PARTNER_CLIENT_SECRET: CHANGE_ME
  USER_SERVICE_SECRET: CHANGE_ME
  PRODUCT_SERVICE_SECRET: CHANGE_ME
  INVENTORY_SERVICE_SECRET: CHANGE_ME
  ORDER_SERVICE_SECRET: CHANGE_ME
  PAYMENT_SERVICE_SECRET: CHANGE_ME
  INVOICE_SERVICE_SECRET: CHANGE_ME
  NOTIFICATION_SERVICE_SECRET: CHANGE_ME
  AUDIT_SERVICE_SECRET: CHANGE_ME
  TOKEN_SERVICE_SECRET: CHANGE_ME
  INVENTORY_DB_PASSWORD: CHANGE_ME
  INVOICE_DB_PASSWORD: CHANGE_ME
  NOTIFICATION_DB_PASSWORD: CHANGE_ME
  ORDER_DB_PASSWORD: CHANGE_ME
  PAYMENT_DB_PASSWORD: CHANGE_ME
  PRODUCT_DB_PASSWORD: CHANGE_ME
  TOKEN_DB_PASSWORD: CHANGE_ME
  USER_DB_PASSWORD: CHANGE_ME
