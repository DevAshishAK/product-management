apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
data:
  SPRING_PROFILES_ACTIVE: kubernetes
  CONFIG_SERVER_URL: http://config-server:8888
  KAFKA_BOOTSTRAP: kafka:9092
  KAFKA_REPLICAS: "1"
  KAFKA_MIN_ISR: "1"
  TOKEN_JWKS_URI: http://token-service:9000/.well-known/jwks.json
  OTLP_TRACING_ENDPOINT: http://tempo.monitoring.svc:4318/v1/traces
  TRACING_SAMPLING: "0.2"
  CORS_ALLOWED_ORIGINS: https://app.pcom.example.com
  OPS_USER: ops
