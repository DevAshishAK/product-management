# Used by `sonar-scanner` CLI. With Maven use: mvn sonar:sonar (see .github/workflows/ci-cd.yml)
sonar.projectKey=pcom-platform
sonar.projectName=PCOM Platform
sonar.organization=your-sonar-organization
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.libraries=target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/*Application.java,**/config/**,**/dto/**,**/entity/**,**/client/**,**/*Properties.java
sonar.cpd.exclusions=**/dto/**,**/entity/**
# Quality gate (conditions are defined in SonarQube/SonarCloud: "Sonar way" + coverage on new code >= 80%)
sonar.qualitygate.wait=true
