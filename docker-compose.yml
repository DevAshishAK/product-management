      DB_URL: jdbc:postgresql://postgres:5432/userdb
      DB_USER: user_svc
      DB_PASSWORD: ${USER_DB_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      config-server:
